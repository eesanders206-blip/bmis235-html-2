<!-- DARK MODE SCRIPT -->
<script>

  // Your customized colors
  var lightColor = "#e6f2ff";
  var darkColor  = "#142b45";

  var dark = false;

  function paint() {
    var pageColor = dark ? darkColor : lightColor;
    var blockColor = dark ? lightColor : darkColor;

    document.body.style.backgroundColor = pageColor;
    document.body.style.color = dark ? "#ffffff" : "#142b45";

    var block = document.getElementById("embed-block");
    block.style.backgroundColor = blockColor;
    block.style.color = dark ? "#142b45" : "#ffffff";
  }

  function toggleDark() {
    dark = !dark;
    paint();
  }

  paint();

</script>
